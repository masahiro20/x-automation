name: 投稿案を生成（予備）

# ふだんは Claude Code のルーティン（ROUTINE.md）が投稿案を作る。
# これはルーティンが失敗して投稿待ちが 2 本未満になったときだけ API で補充する予備。
on:
  schedule:
    - cron: "0 1 * * *" # 10:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 図解用の日本語フォントを入れる
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: 投稿案を生成
        run: python src/generate.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY || '3' }}
          # 手動実行のときは本数に関係なく補充する
          MIN_QUEUE: ${{ github.event_name == 'schedule' && '2' || '' }}
      - name: キューを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/ logs/
          git diff --cached --quiet || (git commit -m "投稿案を追加" && git pull --rebase && git push)
