name: X に投稿

on:
  schedule:
    # GitHub の定期実行は遅れることがあるので、投稿枠（7:30 / 12:15 / 21:00 JST）から
    # 2 時間半の間は 15 分おきに起動する。投稿するかは src/post.py が枠を見て判断する
    - cron: "*/15 22,23,0 * * *" # 7:00〜9:59 JST
    - cron: "*/15 3,4,5 * * *" # 12:00〜14:59 JST
    - cron: "*/15 12,13,14 * * *" # 21:00〜23:59 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: queue
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 1 本投稿
        run: python src/post.py
        env:
          POSTING_ENABLED: ${{ vars.POSTING_ENABLED }}
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      - name: キューを保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/posts.json
          git diff --cached --quiet || (git commit -m "投稿済みを記録" && git pull --rebase && git push)
