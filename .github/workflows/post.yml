name: X に投稿

on:
  schedule:
    # GitHub の定期実行は大きく遅れたり飛ばされたりするので、7:00〜24:00 JST の間 30 分おきに起動する。
    # 投稿するかは src/post.py が枠（7:30 / 12:15 / 21:00、それぞれ次の枠まで有効）を見て判断する。
    - cron: "*/30 22,23,0-14 * * *"
  # Claude Code のルーティンが 7:35 / 12:35 / 21:35 に logs/heartbeat.txt を push して起動する（こちらが本命）。
  # ほかの push でも動くが、投稿するのは枠がまだ投稿されていないときだけ
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "時間帯に関係なく今すぐ 1 本投稿する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: queue
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 1 本投稿
        run: python src/post.py
        env:
          POSTING_ENABLED: ${{ vars.POSTING_ENABLED }}
          FORCE_POST: ${{ inputs.force }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      - name: キューを保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/posts.json
          git diff --cached --quiet || (git commit -m "投稿済みを記録" && git pull --rebase && git push)
